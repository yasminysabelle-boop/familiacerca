[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  VITE_SUPABASE_URL = "https://ofubzbqaxaepxjicyegz.supabase.co"
  VITE_SUPABASE_ANON_KEY = "sb_publishable_xbbhMRO6XcgVu3yod6X1cA_63CwhlTM"
  SECRETS_SCAN_ENABLED = "false"

# Cache hashed assets forever (Vite fingerprints all filenames)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Security headers for all pages
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-XSS-Protection = "1; mode=block"
    Permissions-Policy = "camera=(), geolocation=()"
