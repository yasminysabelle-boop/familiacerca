<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#2D4A1E" />
  <title>FamiliaCerca — Sin conexión</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background: #F0EDE6;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: #1A1A1A;
    }
    .card {
      background: white;
      border-radius: 24px;
      padding: 40px 32px;
      max-width: 400px;
      width: 100%;
      text-align: center;
      box-shadow: 0 4px 32px rgba(0,0,0,0.08);
      border: 1px solid #EDE5D8;
    }
    .icon { font-size: 52px; margin-bottom: 20px; line-height: 1; }
    .title {
      font-size: 20px;
      font-weight: 700;
      color: #2D4A1E;
      margin-bottom: 10px;
      font-family: Georgia, serif;
    }
    .subtitle {
      font-size: 14px;
      color: #6B7280;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .links {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .link {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border-radius: 14px;
      background: #F7F3ED;
      border: 1px solid #EDE5D8;
      color: #1A1A1A;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      transition: background 0.15s;
    }
    .link:active { background: #EDE5D8; }
    .link-icon { font-size: 20px; flex-shrink: 0; }
    .retry-btn {
      margin-top: 24px;
      padding: 12px 28px;
      border-radius: 14px;
      border: none;
      background: #2D4A1E;
      color: white;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      font-family: inherit;
    }
    .badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      color: #9CA3AF;
      background: #F3F4F6;
      border-radius: 8px;
      padding: 3px 8px;
      margin-left: auto;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h1 class="title">Estás sin conexión</h1>
    <p class="subtitle">
      Mostrando información guardada.<br>
      Puedes seguir viendo tus datos mientras recuperas la señal.
    </p>

    <div class="links">
      <a href="/hoy" class="link">
        <span class="link-icon">💊</span>
        Medicamentos de hoy
        <span class="badge">guardado</span>
      </a>
      <a href="/cuidado" class="link">
        <span class="link-icon">✅</span>
        Rutinas de cuidado
        <span class="badge">guardado</span>
      </a>
      <a href="/notes" class="link">
        <span class="link-icon">📝</span>
        Notas médicas
        <span class="badge">guardado</span>
      </a>
      <a href="/medications" class="link">
        <span class="link-icon">📋</span>
        Lista de medicamentos
        <span class="badge">guardado</span>
      </a>
    </div>

    <button class="retry-btn" onclick="window.location.reload()">
      🔄 Intentar reconectar
    </button>
  </div>
</body>
</html>
